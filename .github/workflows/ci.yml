name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: resolveai
          POSTGRES_DB: resolveai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (PostgreSQL + pgvector)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://resolveai:resolveai@127.0.0.1:5432/resolveai_test
        run: pytest --cov --cov-report=term

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://resolveai:resolveai@127.0.0.1:5432/resolveai_migrations
        run: |
          psql "postgresql://resolveai:resolveai@127.0.0.1:5432/resolveai_test" \
            -c "CREATE DATABASE resolveai_migrations"
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build api web
