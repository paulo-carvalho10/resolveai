[project]
name = "resolveai-backend"
version = "0.1.0"
description = "AI-powered service desk API"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Demo article prose: wrapping it would change the stored text.
"app/scripts/seed_knowledge.py" = ["E501"]
# Name lists read better as text than as 20-item literals.
"app/scripts/demo_data.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
