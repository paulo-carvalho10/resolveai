services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Same file as local development (JWT secret, AI_PROVIDER, ANTHROPIC_API_KEY...).
    # Optional: without it the app runs on safe defaults (keyword classifier).
    env_file:
      - path: ./backend/.env
        required: false
    # Container-specific values; these take precedence over env_file.
    environment:
      DATABASE_URL: postgresql+psycopg://resolveai:resolveai@db:5432/resolveai
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
